; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif8266
board = d1
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^7.0.4
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	adafruit/DHT sensor library@^1.4.7
	adafruit/Adafruit SSD1306@^2.5.17
lib_extra_dirs = /home/pobopo/projects/smart_thing/smart_thing_lib/lib
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default

[env:outdoor_meteo_station]
build_flags = 
	'-DOUTDOOR_METEO_STATION=1'
	'-D__VERSION=1.0'
	'-DENABLE_TEXT_SENSORS=0'
upload_protocol = espota
upload_port = 192.168.0.140

[env:room_meteo_station]
build_flags = 
	'-DROOM_METEO_STATION=1'
	'-D__VERSION=1.0'
	'-DENABLE_TEXT_SENSORS=0'
upload_protocol = espota
upload_port = 192.168.0.161